name: DenaviGrabadora
options:
  bundleIdPrefix: lab.denavi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DenaviGrabadora:
    type: application
    platform: iOS
    sources: [Grabadora]
    info:
      path: Grabadora/Info.plist
      properties:
        CFBundleDisplayName: Grabadora
        NSMicrophoneUsageDescription: "Grabadora necesita el micrófono para grabar tus samples."
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
  GrabadoraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: DenaviGrabadora
