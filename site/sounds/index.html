<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DenaviLab: Sounds</title>
<meta name="description" content="capturador de sonidos para sampling">
<meta name="theme-color" content="#0d1311">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DL Sounds">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Graba un sonido, córtalo y déjalo listo para tu sampler. Hecha por Rolando Chaparro Gehren (Denavi Records).">
<meta property="og:title" content="DenaviLab: Sounds"><meta property="og:description" content="Graba un sonido, córtalo y déjalo listo para tu sampler. Todo queda en tu teléfono, sin cuenta."><meta property="og:type" content="website"><meta property="og:image" content="https://denavilab.neocities.org/sounds/icons/icon-512.png"><meta name="twitter:card" content="summary">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css?v=30">
</head>
<body>
<div id="app">
  <div id="update" hidden><span>Hay una versión nueva.</span> <button type="button">Actualizar</button></div>
  <main id="screen" tabindex="-1"><noscript><p style="padding:24px">DenaviLab: Sounds necesita JavaScript.</p></noscript></main>
  <nav id="tabs" role="tablist" aria-label="Secciones" hidden></nav>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<!-- Sesión: la misma puerta del resto del sitio (acceso.js). Se mueve a Inicio al pintar esa pantalla. -->
<p id="sesion" class="sesion muted small center" hidden></p>
<button type="button" id="btnLogin" hidden>Entrar</button>
<dialog id="puerta">
  <form method="dialog" id="formPuerta">
    <h2>Entra a DenaviLab</h2>
    <p class="por">Con tu nombre y tu clave.</p>
    <label>Nombre
      <input type="text" id="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </label>
    <label>Clave
      <span class="campo-clave">
        <input type="password" id="clave" autocomplete="current-password" required>
        <button type="button" class="ver-clave" id="verClave" aria-pressed="false" aria-label="Mostrar la clave">Ver</button>
      </span>
    </label>
    <p class="error" id="errorPuerta" role="alert"></p>
    <div class="fila">
      <button type="button" class="btn outline" id="cancelar">Cancelar</button>
      <button type="submit" class="btn amber">Entrar</button>
    </div>
    <div class="fila-invitado">
      <span>¿Quieres probarlo sin cuenta?</span>
      <button type="button" class="btn outline small" id="entrarInvitado">Entrar como invitado</button>
    </div>
  </form>
</dialog>

<script src="../acceso.js?v=20260915f" defer></script>
<script>
/* Red de seguridad: si la app no llega a dibujar nada en 5 s (caché vieja, módulo que no carga, navegador sin soporte), muestra el motivo y un botón para recargar limpio. */
(function () {
  var errs = [];
  function add(m) { try { errs.push(String(m)); } catch (e) {} }
  addEventListener('error', function (e) { add((e.message || 'error') + (e.filename ? ' @' + e.filename.split('/').pop() + ':' + e.lineno : '')); }, true);
  addEventListener('unhandledrejection', function (e) { add((e.reason && e.reason.message) || e.reason); });
  setTimeout(function () {
    var s = document.getElementById('screen'); if (document.documentElement.dataset.listo) return;
    var d = document.createElement('div'); d.setAttribute('role', 'alert'); d.style.cssText = 'padding:24px;font:16px/1.4 system-ui,sans-serif;color:#f4ede1;max-width:520px;margin:0 auto';
    var h = document.createElement('h2'); h.textContent = 'No se pudo abrir la app'; h.style.margin = '0 0 8px';
    var p = document.createElement('p'); p.textContent = 'Prueba recargarla limpiando lo guardado de esta página. Tus sonidos no se borran.';
    var b = document.createElement('button'); b.type = 'button'; b.textContent = 'Recargar limpio'; b.style.cssText = 'min-height:48px;padding:0 20px;border-radius:14px;border:0;background:#f2a65a;color:#1c1208;font:700 16px system-ui;cursor:pointer';
    b.onclick = function () {
      var done = function () { location.reload(); };
      Promise.resolve().then(function () { return navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }) : null; })
        .then(function () { return window.caches ? caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }) : null; }).then(done, done);
    };
    var pre = document.createElement('pre'); pre.style.cssText = 'white-space:pre-wrap;font-size:12px;color:#9aa89f;margin-top:16px'; pre.textContent = errs.length ? errs.slice(0, 5).join('\n') : 'Sin detalles del navegador.';
    d.append(h, p, b, pre); (s || document.body).appendChild(d);
  }, 5000);
})();
</script>
<script type="module" src="main.js"></script>
</body>
</html>
