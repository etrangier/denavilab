name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar visitas de Neocities
        run: |
          curl -s "https://neocities.org/api/info?sitename=denavilab" -o /tmp/neo.json || echo '{}' > /tmp/neo.json
          jq '(.info // {}) + {"_actualizado": (now | todate)}' /tmp/neo.json > site/neocities-stats.json || echo '{}' > site/neocities-stats.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
